<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 320" width="490" height="320">
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .bg { fill: #0d1117; rx: 8px; }
    .border { fill: none; stroke: #30363d; stroke-width: 1px; rx: 8px; }
    .header { fill: #161b22; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 12px; font-weight: 600; fill: #8b949e; text-anchor: middle; }
    .key { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 12px; font-weight: 600; fill: #58a6ff; }
    .val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, "Apple Color Emoji", "Segoe UI Emoji"; font-size: 12px; fill: #c9d1d9; }
    .quote-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 11px; font-style: italic; fill: #8b949e; text-anchor: middle; }
    .animated-row { opacity: 0; animation: fadeIn 0.4s ease-out forwards; }
    .delay-1 { animation-delay: 0.08s; }
    .delay-2 { animation-delay: 0.16s; }
    .delay-3 { animation-delay: 0.24s; }
    .delay-4 { animation-delay: 0.32s; }
    .delay-5 { animation-delay: 0.4s; }
    .delay-6 { animation-delay: 0.48s; }
    .delay-7 { animation-delay: 0.56s; }
    .delay-8 { animation-delay: 0.64s; }
    .delay-9 { animation-delay: 0.72s; }
    .delay-10 { animation-delay: 0.8s; }
    .delay-11 { animation-delay: 0.88s; }
  </style>
  <!-- Background -->
  <rect width="490" height="320" class="bg" />
  <!-- Header Bar -->
  <path d="M 0 8 A 8 8 0 0 1 8 0 L 482 0 A 8 8 0 0 1 490 8 L 490 32 L 0 32 Z" class="header" />
  <!-- Header Window Dots -->
  <circle cx="20" cy="16" r="6" fill="#ff5f56" />
  <circle cx="38" cy="16" r="6" fill="#ffbd2e" />
  <circle cx="56" cy="16" r="6" fill="#27c93f" />
  <!-- Header Title -->
  <text x="245" y="20" class="title">matheus@cpb ~ neofetch</text>
  <!-- Content Container -->
  <g transform="translate(24, 0)">
    <g class="animated-row delay-1" transform="translate(0, 58)">
      <text x="0" y="0" class="key">User:</text>
      <text x="120" y="0" class="val">Matheus Diniz (@mat-dgruber)</text>
    </g>
    <g class="animated-row delay-2" transform="translate(0, 80)">
      <text x="0" y="0" class="key">Role:</text>
      <text x="120" y="0" class="val">Engenheiro de Software Pleno</text>
    </g>
    <g class="animated-row delay-3" transform="translate(0, 102)">
      <text x="0" y="0" class="key">Company:</text>
      <text x="120" y="0" class="val">Casa Publicadora Brasileira (CPB)</text>
    </g>
    <g class="animated-row delay-4" transform="translate(0, 124)">
      <text x="0" y="0" class="key">Location:</text>
      <text x="120" y="0" class="val">Tatuí, SP - Brasil 🇧🇷</text>
    </g>
    <line x1="0" y1="138" x2="442" y2="138" stroke="#30363d" stroke-width="1" class="animated-row delay-5" />
    <g class="animated-row delay-6" transform="translate(0, 160)">
      <text x="0" y="0" class="key">Core Stack:</text>
      <text x="120" y="0" class="val">Go | TypeScript | Python | SQL</text>
    </g>
    <g class="animated-row delay-7" transform="translate(0, 182)">
      <text x="0" y="0" class="key">AI &amp; Agentes:</text>
      <text x="120" y="0" class="val">OpenClaude | Tool Calling | MCP</text>
    </g>
    <g class="animated-row delay-8" transform="translate(0, 204)">
      <text x="0" y="0" class="key">Compiladores:</text>
      <text x="120" y="0" class="val">Harpia (Linguagem Reativa em Go)</text>
    </g>
    <g class="animated-row delay-9" transform="translate(0, 226)">
      <text x="0" y="0" class="key">Formação:</text>
      <text x="120" y="0" class="val">ADS + Pós em IA Aplicada</text>
    </g>
    <g class="animated-row delay-10" transform="translate(221, 264)">
      <text x="0" y="0" class="quote-text">&quot;Elegância é quando não há mais nada a retirar.&quot;</text>
    </g>
  </g>
  <rect width="489" height="319" x="0.5" y="0.5" class="border" />
</svg>